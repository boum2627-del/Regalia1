<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGALIA | Luxury Automotive</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c5a059;
            --dark: #0a0a0a;
            --grey: #121212;
            --light: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; text-decoration: none; list-style: none; }

        body {
            background-color: var(--dark);
            color: var(--light);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- NAVIGATION --- */
        nav {
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            letter-spacing: 5px;
            color: var(--gold);
        }

        .menu-btn {
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--gold);
            transition: 0.3s;
        }

        /* --- SIDEBAR MENU --- */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%; /* Hidden by default */
            width: 300px;
            height: 100vh;
            background: var(--grey);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            padding: 80px 40px;
            transition: 0.5s ease-in-out;
            border-left: 1px solid var(--gold);
        }

        .sidebar.active { right: 0; }

        .sidebar a {
            color: var(--light);
            font-size: 1.2rem;
            margin: 20px 0;
            letter-spacing: 3px;
            transition: 0.3s;
        }

        .sidebar a:hover { color: var(--gold); }

        .close-btn {
            position: absolute;
            top: 25px;
            right: 40px;
            font-size: 2rem;
            cursor: pointer;
            color: var(--gold);
        }

        /* --- SECTIONS --- */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=2070') center/cover;
        }

        .btn-gold {
            padding: 15px 40px;
            border: 1px solid var(--gold);
            background: transparent;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.4s;
            display: inline-block;
        }

        .btn-gold:hover { background: var(--gold); color: var(--dark); }

        .car-section { padding: 100px 5%; text-align: center; }
        
        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 50px 0;
        }

        .car-img { width: 100%; height: 350px; object-fit: cover; border: 1px solid #222; }

        .contact-section { background: var(--grey); padding: 100px 5%; }

        input, textarea {
            width: 100%; padding: 15px; background: transparent;
            border: none; border-bottom: 1px solid #333; color: white;
            margin-bottom: 30px; outline: none;
        }

        /* --- ANIMATION REVEAL --- */
        .reveal { opacity: 0; transform: translateY(30px); transition: 1s; }
        .reveal.active { opacity: 1; transform: translateY(0); }

    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="close-btn" onclick="toggleMenu()">×</div>
        <a href="#" onclick="toggleMenu()">HOME</a>
        <a href="#bmw" onclick="toggleMenu()">COLLECTION</a>
        <a href="#contact" onclick="toggleMenu()">CONTACT</a>
    </div>

    <nav>
        <div class="logo">REGALIA</div>
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
    </nav>

    <section class="hero">
        <div>
            <h1 style="font-size: 4rem; letter-spacing: 10px; font-family: 'Playfair Display';">REGALIA</h1>
            <p style="margin: 20px 0 40px; letter-spacing: 5px; color: var(--gold);">THE PINNACLE OF LUXURY</p>
            <a href="#bmw" class="btn-gold">DISCOVER NOW</a>
        </div>
    </section>

    <section class="car-section reveal" id="bmw">
        <h2 style="font-family: 'Playfair Display'; font-size: 2.5rem;">BMW M4 COMPETITION</h2>
        <div class="car-grid">
            <img src="https://images.unsplash.com/photo-1619362224246-09090f488669?auto=format&fit=crop&q=80&w=600" class="car-img">
            <img src="https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&q=80&w=600" class="car-img">
            <img src="https://images.unsplash.com/photo-1606148281320-362088f63566?auto=format&fit=crop&q=80&w=600" class="car-img">
        </div>
        <a href="#contact" class="btn-gold">REQUEST CONFIGURATION</a>
    </section>

    <section class="contact-section reveal" id="contact">
        <div style="max-width: 600px; margin: 0 auto;">
            <h2 style="text-align: center; font-family: 'Playfair Display'; margin-bottom: 50px;">GET IN TOUCH</h2>
            <form onsubmit="event.preventDefault(); alert('Message reçu. Nous vous contacterons bientôt.');">
                <input type="text" placeholder="NOM COMPLET" required>
                <input type="email" placeholder="VOTRE EMAIL" required>
                <textarea rows="4" placeholder="VOTRE PROJET..."></textarea>
                <button type="submit" class="btn-gold" style="width: 100%;">ENVOYER</button>
            </form>
        </div>
    </section>

    <script>
        // Toggle Sidebar Menu
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        }

        // Scroll Reveal Animation
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>
</html>
