<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGALIA | L'Art de la Domination</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c5a059;
            --dark: #0a0a0a;
            --light: #ffffff;
            --grey: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--dark);
            color: var(--light);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        /* Navigation */
        nav {
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            letter-spacing: 4px;
            color: var(--gold);
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?auto=format&fit=crop&q=80&w=2070') center/cover;
            animation: fadeIn 2s ease-in;
        }

        .hero-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            letter-spacing: 10px;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .gold-line {
            width: 100px;
            height: 2px;
            background: var(--gold);
            margin: 20px auto;
        }

        .btn-discover {
            padding: 12px 35px;
            border: 1px solid var(--gold);
            background: transparent;
            color: var(--gold);
            text-decoration: none;
            letter-spacing: 2px;
            transition: 0.4s;
            cursor: pointer;
        }

        .btn-discover:hover {
            background: var(--gold);
            color: var(--dark);
        }

        /* Filter Section */
        .filter-section {
            background: var(--grey);
            padding: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: -50px;
            position: relative;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid rgba(197, 160, 89, 0.2);
        }

        select, button.search-btn {
            padding: 12px 20px;
            background: var(--dark);
            color: white;
            border: 1px solid #333;
            width: 200px;
        }

        .search-btn {
            background: var(--gold);
            color: black;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Reveal on scroll */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">REGALIA</div>
        <div class="menu-icon" style="color: white; cursor: pointer;">☰</div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1>L'ART DE LA DOMINATION</h1>
            <div class="gold-line"></div>
            <p style="margin-bottom: 30px; letter-spacing: 3px;">EXPERIENCE LUXURY AT ITS PEAK</p>
            <a href="#" class="btn-discover">DÉCOUVRIR &gt;</a>
        </div>
    </section>

    <div class="filter-section">
        <select>
            <option>MARQUE</option>
            <option>BMW</option>
            <option>FERRARI</option>
        </select>
        <select>
            <option>MODÈLE</option>
            <option>M4 COMPETITION</option>
            <option>F8 TRIBUTO</option>
        </select>
        <button class="search-btn">RECHERCHER</button>
    </div>

    <section style="padding: 100px 10% text-align: center;" class="reveal">
        <h2 style="font-family: 'Playfair Display'; font-size: 2.5rem; margin-bottom: 50px;">NOTRE PHILOSOPHIE</h2>
        <p style="color: #888; line-height: 1.8; max-width: 800px; margin: 0 auto;">
            Regalia n'est pas seulement un concessionnaire, c'est une curateur d'excellence automobile. 
            Chaque véhicule est sélectionné pour sa rareté et son caractère exceptionnel.
        </p>
    </section>

    <script>
        // Scroll Animation logic
        window.addEventListener('scroll', () => {
            const reveals = document.querySelectorAll('.reveal');
            reveals.forEach(reveal => {
                const windowHeight = window.innerHeight;
                const revealTop = reveal.getBoundingClientRect().top;
                if (revealTop < windowHeight - 100) {
                    reveal.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
